<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sync benchmark</title>
    <style>
      :root { color-scheme: dark; font: 13px/1.4 system-ui, sans-serif; }
      body { margin: 0; background: #1d1d1f; color: #e6e6e6; display: grid; grid-template-columns: 420px 1fr; height: 100vh; }
      canvas { width: 100%; height: 100%; display: block; }
      aside { padding: 12px 16px; overflow: auto; border-right: 1px solid #3a3a3d; }
      h1 { font-size: 15px; margin: 0 0 6px; }
      p { color: #9a9aa0; margin: 0 0 10px; }
      a { color: #4fa3e0; }
      table { border-collapse: collapse; width: 100%; font: 11px/1.4 ui-monospace, monospace; }
      th, td { text-align: right; padding: 2px 4px; border-bottom: 1px solid #2c2c2f; }
      th:first-child, td:first-child { text-align: left; }
      #status { color: #e87d0d; }
    </style>
  </head>
  <body>
    <aside>
      <h1>Sync benchmark: <span id="mode"></span></h1>
      <p>Same scenario, same in-tab Blender runtime. Run each mode in a fresh load:
        <a href="?mode=session">session</a> (persistent Blender) · <a href="?mode=sdk">sdk</a> (a Blender run per request) · <a href="?mode=legacy">legacy</a> (whole-scene GLB export and reload per operation).</p>
      <p id="status">Starting…</p>
      <table id="results"></table>
      <p id="memory"></p>
    </aside>
    <main><canvas id="viewport"></canvas></main>
    <script type="module" src="/src/bench.ts"></script>
  </body>
</html>
