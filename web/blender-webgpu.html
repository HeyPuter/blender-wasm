<!doctype html>
<meta charset="utf-8" />
<title>Blender WASM + WebGPU</title>
<style>body{font:12px monospace;background:#161616;color:#ddd;margin:12px}#log{white-space:pre-wrap}</style>
<h1>Full Blender → WASM + WebGPU device handoff</h1>
<div id="log"></div>
<canvas id="canvas" style="display:none" width="64" height="64"></canvas>
<script>
  const el = document.getElementById("log");
  const log = (m) => { el.textContent += m + "\n"; console.log(m); };
  window.__BWGPU__ = { booted: false, device: false, pipeline: false };
  window.onerror = (e) => { log("JS ERROR: " + e); };

  // Watch Blender's stderr for the markers our WebGPUContext / boot print.
  const scan = (t) => {
    if (t.includes("WEBGPU_CONTEXT") && t.includes("real device acquired")) {
      window.__BWGPU__.device = true;
      window.__BWGPU__.pipeline = true;        // context is created from within the render pipeline
      document.title = "BLENDER WEBGPU OK";
    }
    if (t.includes("WEBGPU_CONTEXT no device")) { window.__BWGPU__.deviceless = true; }
    if (t.includes("Blender") && t.includes("Alpha")) { window.__BWGPU__.booted = true; }
  };

  // The render bpy expr: set a tiny resolution and invoke a render so the draw
  // manager creates the GPU context (where emscripten_webgpu_get_device() runs).
  const PYEXPR =
    "import bpy;print('PYSTART');" +
    "s=bpy.context.scene;s.render.resolution_x=64;s.render.resolution_y=64;" +
    "print('WENGINE',s.render.engine);" +
    "import traceback\n" +
    // Set a bright RED world so a correct WebGPU capture is unambiguous.
    "try:\n" +
    " w=bpy.context.scene.world; w.use_nodes=True\n" +
    " bg=w.node_tree.nodes.get('Background')\n" +
    " bg.inputs[0].default_value=(1.0,0.0,0.0,1.0); bg.inputs[1].default_value=3.0\n" +
    " print('WORLD set red')\n" +
    "except Exception as e:\n traceback.print_exc()\n" +
    "try:\n bpy.ops.render.render(write_still=False)\nexcept Exception as e:\n traceback.print_exc()\n" +
    "print('PYDONE')";

  var Module = {
    arguments: ["--factory-startup", "-b", "--python-expr", PYEXPR],
    canvas: document.getElementById("canvas"),
    print: (t) => { log(t); scan(t); },
    printErr: (t) => { log("[err] " + t); scan(t); },
    preRun: [function () {
      // Help Blender locate its preloaded runtime trees regardless of argv[0].
      try {
        ENV.BLENDER_SYSTEM_SCRIPTS = "/5.3/scripts";
        ENV.BLENDER_SYSTEM_DATAFILES = "/5.3/datafiles";
      } catch (e) { log("preRun ENV note: " + e); }
    }],
    onAbort: (w) => { log("ABORT: " + w); },
  };

  (async () => {
    if (!navigator.gpu) { log("no navigator.gpu"); document.title = "BLENDER WEBGPU FAIL"; return; }
    let adapter = await navigator.gpu.requestAdapter();
    if (!adapter) adapter = await navigator.gpu.requestAdapter({ forceFallbackAdapter: true });
    if (!adapter) { log("no adapter"); document.title = "BLENDER WEBGPU FAIL"; return; }
    // EEVEE shaders use optional WebGPU features; request any the adapter exposes
    // so module creation (dual-source blending, rw storage textures, etc.) and
    // float texture filtering are accepted instead of rejected at use.
    const wanted = ["dual-source-blending", "float32-filterable", "rg11b10ufloat-renderable",
                    "bgra8unorm-storage", "shader-f16", "depth32float-stencil8"];
    const requiredFeatures = wanted.filter((f) => adapter.features.has(f));
    log("device features: " + requiredFeatures.join(", "));
    // Request the adapter's MAXIMUM limits. EEVEE's compute passes exceed WebGPU
    // baseline limits (>4 storage textures/stage, large workgroups, big buffers);
    // raising the device limits to whatever the adapter supports lets those
    // pipelines validate instead of failing at layout/pipeline creation.
    const wantLimits = [
      "maxStorageTexturesPerShaderStage", "maxStorageBuffersPerShaderStage",
      "maxSampledTexturesPerShaderStage", "maxSamplersPerShaderStage",
      "maxUniformBuffersPerShaderStage", "maxComputeWorkgroupSizeX",
      "maxComputeWorkgroupSizeY", "maxComputeWorkgroupSizeZ",
      "maxComputeInvocationsPerWorkgroup", "maxComputeWorkgroupStorageSize",
      "maxComputeWorkgroupsPerDimension", "maxStorageBufferBindingSize",
      "maxUniformBufferBindingSize", "maxBufferSize", "maxBindGroups",
      "maxBindingsPerBindGroup", "maxTextureDimension2D", "maxTextureDimension3D",
      "maxTextureArrayLayers", "maxColorAttachments",
    ];
    const requiredLimits = {};
    for (const k of wantLimits) {
      const v = adapter.limits[k];
      if (v !== undefined) { requiredLimits[k] = v; }
    }
    log("max storage-tex/stage: " + requiredLimits.maxStorageTexturesPerShaderStage +
        ", max wg: " + requiredLimits.maxComputeWorkgroupSizeX);
    Module.preinitializedWebGPUDevice = await adapter.requestDevice({ requiredFeatures, requiredLimits });
    log("WebGPU device acquired in JS; handing to wasm and loading Blender (~210MB)…");
    const s = document.createElement("script");
    s.src = "blender.js";
    document.body.appendChild(s);
  })();
</script>
