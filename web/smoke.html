<!doctype html>
<meta charset="utf-8" />
<title>blender-wasm toolchain smoke test</title>
<style>
  body { font: 14px monospace; background: #1a1a1a; color: #ddd; }
  canvas { border: 1px solid #444; image-rendering: pixelated; }
  #log { white-space: pre-wrap; }
</style>
<h1>pthreads + SIMD smoke test</h1>
<div id="log">booting…</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
  const log = (m) => { document.getElementById("log").textContent += "\n" + m; };
  window.onerror = (e) => log("ERROR: " + e);
  var Module = {
    onRuntimeInitialized() {
      log("runtime up, threads=" + navigator.hardwareConcurrency);
      const t0 = performance.now();
      const ptr = Module.ccall("render", "number", [], []);
      const w = Module.ccall("img_w", "number", [], []);
      const h = Module.ccall("img_h", "number", [], []);
      const dt = (performance.now() - t0).toFixed(1);
      const bytes = Module.HEAPU8.subarray(ptr, ptr + w * h * 4);
      const cv = document.getElementById("cv");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      const img = ctx.createImageData(w, h);
      img.data.set(bytes);
      ctx.putImageData(img, 0, 0);
      log(`rendered ${w}x${h} in ${dt}ms`);
      // signal for Playwright
      window.__SMOKE_DONE__ = { w, h, ms: Number(dt) };
      document.title = "SMOKE OK";
    },
  };
</script>
<script src="smoke.js"></script>
