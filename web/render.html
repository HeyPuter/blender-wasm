<!doctype html>
<meta charset="utf-8" />
<title>Cycles WASM — headless CPU render</title>
<style>
  body { font: 13px monospace; background: #181818; color: #ddd; margin: 16px; }
  canvas { border: 1px solid #444; background: #000; image-rendering: auto; }
  #log { white-space: pre-wrap; color: #9c9; max-height: 200px; overflow:auto; }
  h1 { font-size: 16px; }
</style>
<h1>Blender Cycles → WebAssembly (CPU path tracing)</h1>
<div>cores: <span id="cores"></span> · status: <span id="status">booting…</span></div>
<canvas id="cv" width="512" height="512"></canvas>
<div id="log"></div>
<script>
  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  // Mirror to console so the Playwright verifier captures it.
  const log = (m) => { logEl.textContent += m + "\n"; logEl.scrollTop = logEl.scrollHeight; console.log(m); };
  document.getElementById("cores").textContent = navigator.hardwareConcurrency;
  window.onerror = (e) => { log("JS ERROR: " + e); document.title = "RENDER FAIL"; };
  window.__STATUS__ = "start";

  const SCENE = "/scenes/cube.xml";
  const OUT = "/out.png";
  const W = 384, H = 384, SAMPLES = 32;

  // Draw a PNG (bytes in the wasm FS) onto the canvas.
  function showPng(bytes) {
    const blob = new Blob([bytes], { type: "image/png" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const cv = document.getElementById("cv");
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      window.__RENDER_DONE__ = { w: W, h: H, samples: SAMPLES, bytes: bytes.length };
      document.title = "RENDER OK";
      statusEl.textContent = "done";
    };
    img.onerror = () => log("failed to decode output PNG");
    img.src = url;
  }

  var Module = {
    // cycles standalone CLI: render the preloaded scene to a PNG in the FS.
    arguments: ["--background", "--samples", String(SAMPLES),
                "--width", String(W), "--height", String(H),
                "--output", OUT, SCENE],
    // Detect render completion from Cycles' stdout. With PROXY_TO_PTHREAD the
    // program "exits" without firing onExit (runtime kept alive), so we key off
    // the "Finished Rendering." marker — by then /out.png is fully written.
    print: (t) => {
      log(t);
      if (!window.__done && /Finished Rendering\.|Writing image/.test(t)) {
        window.__done = true;
        setTimeout(readOutput, 250);
      }
    },
    printErr: (t) => log("[err] " + t),
    onAbort: (what) => { log("ABORT: " + what); window.__STATUS__ = "abort"; document.title = "RENDER FAIL"; },
    onRuntimeInitialized: () => { log("runtime initialized"); window.__STATUS__ = "running"; statusEl.textContent = "rendering…"; },
    onExit: (code) => { log("cycles exited with code " + code); if (!window.__done) { window.__done = true; readOutput(); } },
  };

  function readOutput() {
    try {
      const bytes = Module.FS.readFile(OUT);   // Uint8Array (shared via WASMFS)
      log("read " + bytes.length + " bytes from " + OUT);
      window.__STATUS__ = "read:" + bytes.length;
      showPng(bytes);
    } catch (e) {
      log("could not read output: " + e);
      window.__STATUS__ = "readfail";
      document.title = "RENDER FAIL";
    }
  }
</script>
<script src="cycles.js"></script>
